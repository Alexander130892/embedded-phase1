# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-avindeli"
BBFILE_PATTERN_meta-avindeli = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-avindeli = "6"

LAYERDEPENDS_meta-avindeli = "core"
LAYERSERIES_COMPAT_meta-avindeli = "scarthgap"
